# MES Workshop 2026 — local infrastructure.
# Pin every image to an explicit version tag; never use :latest.
# Secrets come from .env (git-ignored); commit names only, in .env.example.
#
# Never run `docker compose down -v` without the lead's say-so — it deletes the
# named volumes below and every byte of state in them.

name: mes-workshop-2026

services:
  coreflux:
    image: coreflux/coreflux-mqtt-broker:2.2.0   # same version as the broker the sim uses today
    restart: unless-stopped
    environment:
      COREFLUX_SECRET_KEY: ${COREFLUX_SECRET_KEY:?set COREFLUX_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:${COREFLUX_MQTT_PORT:-1886}:1883"   # MQTT. 1883 is UNS Studio, 1884 the old broker
      - "127.0.0.1:${COREFLUX_WEB_PORT:-8084}:8080"    # web UI
      - "127.0.0.1:${COREFLUX_API_PORT:-5004}:5000"    # websockets / backend API
    volumes:
      - coreflux-data:/etc/coreflux
    # Healthcheck comes from the image (pgrep CorefluxMQTTBroker).

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"   # 5432/5433 are taken by other stacks
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5

  ignition:
    image: inductiveautomation/ignition:8.3.10   # matches resources/installers DMG
    restart: unless-stopped
    depends_on:
      coreflux:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      ACCEPT_IGNITION_EULA: "Y"
      IGNITION_EDITION: standard
      GATEWAY_ADMIN_USERNAME: ${IGNITION_ADMIN_USERNAME:-admin}
      GATEWAY_ADMIN_PASSWORD: ${IGNITION_ADMIN_PASSWORD:?set IGNITION_ADMIN_PASSWORD in .env}
      DISABLE_QUICKSTART: "true"
      TZ: America/Chicago
      # Cirrus Link third-party modules: accept licenses/certs so they load
      # without a manual step in the gateway UI.
      ACCEPT_MODULE_LICENSES: com.cirruslink.mqtt.engine.gateway,com.cirruslink.mqtt.transmission.gateway
      ACCEPT_MODULE_CERTS: com.cirruslink.mqtt.engine.gateway,com.cirruslink.mqtt.transmission.gateway
    ports:
      # 8089 by default so it can run beside other local Ignition gateways.
      - "127.0.0.1:${IGNITION_HTTP_PORT:-8089}:8088"
    volumes:
      - ignition-data:/usr/local/bin/ignition/data
      - ./ignition/projects/mes-2026:/usr/local/bin/ignition/data/projects/mes-2026
      # Mount each .modl individually; mounting the whole folder would hide
      # the built-in modules that ship in user-lib/modules.
      - ./resources/modules/MQTT-Engine-signed.modl:/usr/local/bin/ignition/user-lib/modules/MQTT-Engine-signed.modl:ro
      - ./resources/modules/MQTT-Transmission-signed.modl:/usr/local/bin/ignition/user-lib/modules/MQTT-Transmission-signed.modl:ro
    # Healthcheck comes from the image (StatusPing on :8088).

volumes:
  coreflux-data:
  db-data:
  ignition-data:
